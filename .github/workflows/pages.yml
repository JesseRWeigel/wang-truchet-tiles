name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NOT the shared `group: pages`. A single lock means one wedged run blocks every later deploy,
# and a wedged run cannot always be cancelled: this fleet hit a run that returned 502 to both
# cancel and force-cancel and held the lock indefinitely.
#
# The cost of keying on run_id is real and accepted here: runs no longer serialise, so two
# pushes close together can finish out of order and an older commit can overwrite a newer one.
# For a page deployed by hand a few times that is the better trade.
concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Rebuild the page from source and refuse to deploy a stale one. docs/index.html is
      # generated by inlining src/ and web/, so a commit that changed the generator without
      # rebuilding would otherwise publish a page that does not match the repository it came
      # from, and nothing on the site would say so.
      - name: The committed page must match its sources
        run: node scripts/build_docs.mjs --check

      # The whole tool is one file, so the site is one file. Nothing else is staged, which
      # keeps the published site to exactly what it claims to be.
      - name: Stage the page
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
